name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Standalone APK
        run: |
          rm -rf /tmp/dobby_build
          flutter create --org com.dobbystudio --project-name dobby_app /tmp/dobby_build
          cd /tmp/dobby_build
          flutter pub add url_launcher
          cp $GITHUB_WORKSPACE/lib/main.dart lib/main.dart
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dobby-studio-app
          path: app-release.apk
