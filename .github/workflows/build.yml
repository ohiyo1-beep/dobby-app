name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Standalone APK with In-App WebView and Image Picker
        run: |
          rm -rf /tmp/dobby_build
          flutter create --org com.dobbystudio --project-name dobby_app /tmp/dobby_build
          cd /tmp/dobby_build
          
          # ติดตั้งแพ็กเกจที่จำเป็น
          flutter pub add url_launcher
          flutter pub add webview_flutter
          flutter pub add image_picker
          
          # คัดลอกโค้ด main.dart เข้าโปรเจกต์
          cp $GITHUB_WORKSPACE/lib/main.dart lib/main.dart
          
          # ตั้งค่า minSdkVersion เป็น 21 ใน build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true
          
          # เพิ่มสิทธิ์ Permission ใน AndroidManifest.xml (Internet + Storage + Media Images)
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest xmlns:android/a \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"\/>' $MANIFEST_FILE
          
          # สั่งบิลด์ไฟล์ APK Release
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dobby-studio-app
          path: app-release.apk
