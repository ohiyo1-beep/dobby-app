name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Initialize Complete Flutter Android Project
        run: |
          # สำรองโค้ดหน้าจอหลัก main.dart ของเราไว้
          cp lib/main.dart /tmp/my_main.dart
          
          # ลบไฟล์ชั่วคราวออกเพื่อสร้างโครงสร้าง Android มาตรฐานแบบครบวงจร
          rm -rf android lib pubspec.yaml
          flutter create --org com.dobbystudio --project-name dobby_app .
          
          # นำโค้ด main.dart ของเรากลับมาใส่
          cp /tmp/my_main.dart lib/main.dart

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dobby-studio-app
          path: build/app/outputs/flutter-apk/app-release.apk
