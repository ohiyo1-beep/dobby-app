name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Create and Build Clean App
        run: |
          mkdir -p /tmp/backup
          cp lib/main.dart /tmp/backup/main.dart
          cd ..
          rm -rf dobby-app
          flutter create --org com.dobbystudio --project-name dobby_app dobby-app
          cd dobby-app
          flutter pub add url_launcher
          cp /tmp/backup/main.dart lib/main.dart
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dobby-studio-app
          path: ../dobby-app/build/app/outputs/flutter-apk/app-release.apk
