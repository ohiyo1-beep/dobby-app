name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Clean Flutter Project
        run: |
          mkdir -p /tmp/my_code
          cp lib/main.dart /tmp/my_code/main.dart
          rm -rf * .[!.]*
          flutter create --org com.dobbystudio --project-name dobby_app app_temp
          mv app_temp/* app_temp/.[!.]* . 2>/dev/null || true
          rm -rf app_temp
          cp /tmp/my_code/main.dart lib/main.dart

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dobby-studio-app
          path: build/app/outputs/flutter-apk/app-release.apk
