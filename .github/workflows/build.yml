name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Setup Project and Build
        run: |
          # บันทึกไฟล์ main.dart ที่เราเขียนไว้
          mkdir -p /tmp/backup
          cp lib/main.dart /tmp/backup/main.dart

          # ลบไฟล์เก่าออกให้หมดเพื่อไม่ให้ flutter create ชนไฟล์เดิม
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' -exec rm -rf {} +

          # สร้างโปรเจกต์ใหม่แบบคลีน 100%
          flutter create --org com.dobbystudio --project-name dobby_app .

          # นำ main.dart ของเรากลับมาใส่แทน
          cp /tmp/backup/main.dart lib/main.dart

          # ประกอบไฟล์ APK
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dobby-studio-app
          path: build/app/outputs/flutter-apk/app-release.apk
